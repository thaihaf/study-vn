name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_vn
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d study_vn"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/study_vn
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_TRUST_HOST: 'true'
      AI_PROVIDER: fake
      SEED_ADMIN_EMAIL: admin@ci.example.test
      SEED_ADMIN_PASSWORD: AdminPassword123!
      SEED_LEARNER_EMAIL: seeded-learner@ci.example.test
      SEED_LEARNER_PASSWORD: LearnerPassword123!
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and refresh npm lockfile
        run: npm install

      - name: Refresh pnpm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Normalize hardening files once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          npx prettier --write \
            .specify/memory/constitution.md \
            design-system/study-vn \
            docs/reference-patterns.md \
            README.md \
            TASKS.md \
            specs/001-mvp-hardening \
            src/app/error.tsx \
            src/app/globals.css \
            src/app/loading.tsx \
            src/app/mvp.css \
            src/app/not-found.tsx \
            src/app/page.tsx \
            'src/app/(auth)/login/login-submit-button.tsx' \
            'src/app/(auth)/login/page.tsx' \
            'src/app/(learner)/dashboard/page.tsx' \
            'src/app/(public)/explore/page.tsx' \
            src/app/admin/layout.tsx \
            src/components/shared/header.tsx \
            src/components/ui \
            src/lib/i18n.ts \
            src/modules/assessments/management-actions.ts \
            playwright.config.ts \
            tests/e2e/accessibility.spec.ts \
            tests/e2e/smoke.spec.ts

          git add \
            package-lock.json \
            pnpm-lock.yaml \
            .specify/memory/constitution.md \
            design-system/study-vn \
            docs/reference-patterns.md \
            README.md \
            TASKS.md \
            specs/001-mvp-hardening \
            src/app/error.tsx \
            src/app/globals.css \
            src/app/loading.tsx \
            src/app/mvp.css \
            src/app/not-found.tsx \
            src/app/page.tsx \
            'src/app/(auth)/login/login-submit-button.tsx' \
            'src/app/(auth)/login/page.tsx' \
            'src/app/(learner)/dashboard/page.tsx' \
            'src/app/(public)/explore/page.tsx' \
            src/app/admin/layout.tsx \
            src/components/shared/header.tsx \
            src/components/ui \
            src/lib/i18n.ts \
            src/modules/assessments/management-actions.ts \
            playwright.config.ts \
            tests/e2e/accessibility.spec.ts \
            tests/e2e/smoke.spec.ts

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: normalize hardening files and lockfiles"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate

      - name: Seed deterministic CI users
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Production build without OpenAI key
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Functional and accessibility browser smoke
        run: >-
          npm run test:e2e --
          tests/e2e/smoke.spec.ts
          tests/e2e/accessibility.spec.ts
          --project=chromium
