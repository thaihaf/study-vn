name: Format MVP branch

on:
  push:
    branches:
      - feat/complete-mvp-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/complete-mvp-contract

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format repository
        run: npm run format

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Repository already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format repository"
          git push origin HEAD:feat/complete-mvp-contract
